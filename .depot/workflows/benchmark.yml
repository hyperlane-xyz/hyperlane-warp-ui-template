name: CI benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: depot-ubuntu-24.04
    env:
      NEXT_PUBLIC_WALLET_CONNECT_ID: benchmark
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Mount benchmark cache
        uses: depot/cache-mount@v1
        with:
          name: hyperlane-warp-ui-template-migration-benchmark-20260826-v2
          path: ${{ github.workspace }}/.benchmark-cache

      - name: Configure benchmark cache
        run: |
          pnpm config set store-dir "$GITHUB_WORKSPACE/.benchmark-cache/pnpm-store"
          mkdir -p "$GITHUB_WORKSPACE/.benchmark-cache/next-cache" .next
          ln -s "$GITHUB_WORKSPACE/.benchmark-cache/next-cache" .next/cache

      - name: Run CI
        run: |
          pnpm install --frozen-lockfile
          pnpm run format
          git diff --exit-code
          pnpm run lint
          pnpm run test
          pnpm run build
