name: CI benchmark

on:
  push:
    branches: [pbio/gha-ci-benchmark]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  import-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: depot/setup-action@v1
        with:
          oidc: true
      - name: Import repository secrets
        env:
          E2E_SLACK_WEBHOOK: ${{ secrets.E2E_SLACK_WEBHOOK }}
          NEXT_PUBLIC_WALLET_CONNECT_ID: ${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_ID }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add E2E_SLACK_WEBHOOK="$E2E_SLACK_WEBHOOK" NEXT_PUBLIC_WALLET_CONNECT_ID="$NEXT_PUBLIC_WALLET_CONNECT_ID" --repo hyperlane-xyz/hyperlane-warp-ui-template

  benchmark:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_WALLET_CONNECT_ID: benchmark
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Restore benchmark cache
        uses: actions/cache@v6
        with:
          path: .benchmark-cache
          key: wui-depot-migration-20260826-v3

      - name: Configure benchmark cache
        run: |
          pnpm config set store-dir "$GITHUB_WORKSPACE/.benchmark-cache/pnpm-store"
          mkdir -p "$GITHUB_WORKSPACE/.benchmark-cache/next-cache" .next
          ln -s "$GITHUB_WORKSPACE/.benchmark-cache/next-cache" .next/cache

      - name: Run CI
        run: |
          pnpm install --frozen-lockfile
          pnpm run format
          git diff --exit-code
          pnpm run lint
          pnpm run test
          pnpm run build
