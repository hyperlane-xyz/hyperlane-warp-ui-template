# Reject packages published less than 7 days ago (supply chain protection)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@hyperlane-xyz/*"
  - "@provablehq/*"
overrides:
  # 1.53+ imports optional x402 peers into browser bundles even when unused.
  '@coinbase/cdp-sdk': 1.52.0
  tronweb>ethers: ^6.13.5
  "@solana/web3.js": ^1.95.4
  axios: ^1.7.9
  bignumber: 9.1.2
  bn.js: ^5.2
  cosmjs-types: "0.9"
  ethers: ^5.8.0
  globals: ^14.0.0
  lit-html: 2.8.0
  react-fast-compare: ^3.2
  viem: ^2.21.41
  zustand: ^4.4
  sha.js: 2.4.12
  cipher-base: 1.0.5
  elliptic: 6.6.1
  pbkdf2: 3.1.3
  form-data: 4.0.4
  '@ledgerhq/errors': 6.31.0
  # Pin qr: 0.6.0 added a `border <= 0` throw that crashes the RainbowKit
  # WalletConnect QR modal (cuer calls encodeQR with border:0).
  qr: 0.5.5
patchedDependencies:
  starknetkit@2.6.1: patches/starknetkit@2.6.1.patch
  '@provablehq/sdk@0.11.3': patches/@provablehq__sdk@0.11.3.patch
  '@provablehq/wasm@0.11.6': patches/@provablehq__wasm@0.11.6.patch
allowBuilds:
  '@reown/appkit': false
  "@sentry/cli": false
  '@stellar/stellar-sdk': false
  bigint-buffer: false
  blake-hash: false
  bufferutil: false
  cbor-extract: false
  core-js: false
  esbuild: false
  keccak: false
  protobufjs: false
  secp256k1: false
  sharp: false
  tiny-secp256k1: false
  usb: false
  utf-8-validate: false
